services:
  - type: web
      name: connectxion-premium
          runtime: docker
              plan: free
                  envVars:
                        - key: SUPABASE_URL
                                sync: false
                                      - key: SUPABASE_KEY
                                              sync: false
                                                    - key: SUPABASE_DB_HOST
                                                            sync: false
                                                                  - key: SUPABASE_DB_NAME
                                                                          sync: false
                                                                                - key: SUPABASE_DB_USER
                                                                                        sync: false
                                                                                              - key: SUPABASE_DB_PASSWORD
                                                                                                      sync: false
                                                                                                      
                                                                                                      
